name: Build notarized Camelot DMG

on:
  workflow_dispatch:
    inputs:
      version:
        description: App marketing version
        required: true
        default: 0.1.0
        type: string
      publish:
        description: Publish a GitHub Release (main only)
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: camelot-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select and validate Xcode 26 / Swift 6.2
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          xcodebuild -version | grep -F 'Xcode 26.0.1'
          swift --version | grep -E 'Swift version 6\.2([ .]|$)'

      - name: Reject public release outside main
        if: inputs.publish && github.ref != 'refs/heads/main'
        run: |
          echo "::error::A public release can only be created from main"
          exit 1

      - name: Require a public repository before publishing
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)"
          if [[ "${visibility}" != public ]]; then
            echo "::error::This repository is ${visibility}; public distribution needs a public destination"
            exit 1
          fi

      - name: Validate release version
        env:
          MARKETING_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "${MARKETING_VERSION}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::version must use numeric dot notation"
            exit 1
          fi

      - name: Verify Swift package and distribution scripts
        run: Scripts/verify.sh

      - name: Validate Apple distribution configuration
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          required=(APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID
            DEVELOPER_ID_APPLICATION_P12_BASE64 DEVELOPER_ID_APPLICATION_P12_PASSWORD
            APP_STORE_CONNECT_API_KEY_P8_BASE64)
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::GitHub Actions configuration is missing: ${name}"
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="${RUNNER_TEMP}/camelot-developer-id.p12"
          keychain_path="${RUNNER_TEMP}/camelot-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          trap 'rm -f "${certificate_path}"' EXIT
          echo "SIGNING_KEYCHAIN_PATH=${keychain_path}" >> "${GITHUB_ENV}"
          printf '%s' "${DEVELOPER_ID_APPLICATION_P12_BASE64}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -k "${keychain_path}" \
            -P "${DEVELOPER_ID_APPLICATION_P12_PASSWORD}" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          identity="$(security find-identity -v -p codesigning "${keychain_path}" \
            | awk -F'"' '/Developer ID Application:/ {print $2}')"
          identity_count="$(printf '%s\n' "${identity}" | awk 'NF {n++} END {print n+0}')"
          if [[ "${identity_count}" -ne 1 ]]; then
            echo "::error::Expected exactly one Developer ID identity; found ${identity_count}"
            exit 1
          fi
          [[ "${identity}" == "Developer ID Application:"*"(${APPLE_TEAM_ID})" ]] || {
            echo "::error::Developer ID identity does not match APPLE_TEAM_ID"
            exit 1
          }
          echo "SIGNING_IDENTITY=${identity}" >> "${GITHUB_ENV}"

      - name: Build signed Universal DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          MARKETING_VERSION: ${{ inputs.version }}
        run: Scripts/build-direct-release.sh

      - name: Notarize, staple, verify, and checksum
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          trap 'rm -f "${key_path}"' EXIT
          printf '%s' "${APP_STORE_CONNECT_API_KEY_P8_BASE64}" | base64 --decode > "${key_path}"
          chmod 600 "${key_path}"
          NOTARY_KEY_PATH="${key_path}" Scripts/notarize-release.sh

      - name: Upload notarized artifact
        uses: actions/upload-artifact@v4
        with:
          name: Camelot-macos-notarized-${{ github.run_number }}
          path: |
            build/release/Camelot-macos-universal.dmg
            build/release/Camelot-macos-universal.dmg.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: inputs.publish && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}-${{ github.run_number }}
          RELEASE_TITLE: Camelot v${{ inputs.version }}
        run: |
          gh release create "${RELEASE_TAG}" \
            build/release/Camelot-macos-universal.dmg \
            build/release/Camelot-macos-universal.dmg.sha256 \
            --target "${GITHUB_SHA}" --title "${RELEASE_TITLE}" --generate-notes

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${SIGNING_KEYCHAIN_PATH:-}" && -f "${SIGNING_KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${SIGNING_KEYCHAIN_PATH}"
          fi
